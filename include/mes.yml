# What the elements of boot/mes share.
variables:
  mes-prefix: /src/mes-0.27.1
  nyacc-prefix: /src/nyacc-1.00.2
  mes-lib: "%{prefix}/lib/%{arch}-mes"
  guile-load-path: "%{mes-prefix}/mes/module:%{mes-prefix}/module:%{nyacc-prefix}/module"
  mescc: "%{bindir}/mes-m2 -e main %{bindir}/mescc.scm -D HAVE_CONFIG_H=1 -I include -I include/linux/%{arch} -c"

config:
  env:
    MES_PREFIX: "%{mes-prefix}"
    GUILE_LOAD_PATH: "%{guile-load-path}"
    MES_ARENA: "20000000"
    MES_MAX_ARENA: "20000000"
    MES_STACK: "6000000"
