(@): include/lb-aliases.yml

name: arden-bootstrap
min-version: 2.0
element-path: elements

# The aliases the generated elements share with the project's own (the generator,
# tools/gen-lb-elements.py, reuses these names); the others are in include/lb-aliases.yml.
aliases:
  github: https://github.com/
  kernel-mirror: https://mirrors.kernel.org/
  kernel-mirror-edge: https://mirrors.edge.kernel.org/
  python: https://www.python.org/
  cpan: https://www.cpan.org/
  savannah: https://download.savannah.gnu.org/
  sourceware: https://sourceware.org/
  zlib: https://zlib.net/

plugins:
  - origin: local
    path: plugins
    elements:
      - raw
      - lbstep
  - origin: pip
    package-name: buildstream-plugins
    sources:
      - git
