name: arden-bootstrap
min-version: 2.0
element-path: elements

aliases:
  github: https://github.com/
  gitlab: https://gitlab.com/
  kernel-mirror: https://mirrors.kernel.org/
  kernel-cdn: https://cdn.kernel.org/
  musl: https://musl.libc.org/
  kernel-mirror-edge: https://mirrors.edge.kernel.org/
  python: https://www.python.org/
  cpan: https://www.cpan.org/
  cpan-authors: https://cpan.metacpan.org/
  savannah: https://download.savannah.gnu.org/
  savannah-nongnu: https://git.savannah.nongnu.org/git/
  sourceware: https://sourceware.org/
  sourceforge: https://downloads.sourceforge.net/
  zlib: https://zlib.net/
  unicode: https://www.unicode.org/
  pkgconfig: https://pkgconfig.freedesktop.org/
  astron: http://ftp.astron.com/

options:
  buildarch:
    type: arch
    description: Host architecture
    variable: build-arch
    values:
      - aarch64
      - rv64g
      - x86-64

plugins:
  - origin: local
    path: plugins
    elements:
      - exec
      - kaem
      - raw
      - stage0
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - autotools
      - make
    sources:
      - git
      - patch
  - origin: pip
    package-name: buildstream-plugins-community
    sources:
      - git_repo

variables:
  (?):
    - buildarch == "rv64g":
        triple: riscv64-unknown-linux-gnu
        triple-musl: riscv64-unknown-linux-musl
        cpu: riscv64
    - buildarch == "x86-64":
        triple: x86_64-unknown-linux-gnu
        triple-musl: x86_64-unknown-linux-musl
        cpu: x86_64
