build-depends:
- bash/bash.bst
- coreutils/coreutils-5.0.bst
- gawk/gawk.bst
- grep/grep.bst
- m4/m4.bst
- make/make.bst
- perl/perl-5.6.2.bst
- sed/sed.bst
- tcc/musl/toolchain.bst

variables:
  # Run before configure, in the source tree.
  am-prepare: ""

config:
  configure-commands:
  - |
    %{am-prepare}
    AUTOCONF=%{am-autoconf} ./configure --prefix=%{prefix}
  build-commands:
  - make MAKEINFO=true
  install-commands:
  - |
    make install MAKEINFO=true DESTDIR=%{install-root}
    rm %{install-root}%{bindir}/automake %{install-root}%{bindir}/aclocal
