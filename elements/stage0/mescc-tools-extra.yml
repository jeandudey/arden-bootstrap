# Common to the programs built from mescc-tools-extra, one element each.
# An element sets `program`, which is the name of its C file and of its
# binary.
(@): elements/stage0/m2libc.yml
build-depends:
  - stage0/m2-mesoplanet.bst
  - stage0/mescc-tools-extra.bst

variables:
  # exec's libdir is Mes's; this is where the dependencies stage theirs
  libdir: "%{prefix}/lib"

config:
  env:
    M2LIBC_PATH: "%{libdir}/m2libc"
  dirs:
    - "%{destdir}%{bindir}"
  commands:
    - >-
      M2-Mesoplanet --operating-system Linux --architecture %{m2libc-arch}
      -f %{libdir}/mescc-tools-extra/%{program}.c
      -o %{destdir}%{bindir}/%{program}
